<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="100%" style="max-width:640px;height:auto;display:block;margin:0 auto 2.5rem;border:1px solid #27272a;" role="img" aria-label="Mastering Modern DevOps (Second Edition) — Minimalist Swiss Brutalist Cover">
  <!-- Matte Black Brutalist Canvas -->
  <rect width="1600" height="2400" fill="#09090b"/>

  <!-- Exposed 1px Structural Swiss Grid Lines -->
  <g class="swiss-grid" stroke="#27272a" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="2400"/>
    <line x1="460" y1="0" x2="460" y2="2400"/>
    <line x1="800" y1="0" x2="800" y2="2400"/>
    <line x1="1140" y1="0" x2="1140" y2="2400"/>
    <line x1="1480" y1="0" x2="1480" y2="2400"/>
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="1040" x2="1600" y2="1040"/>
    <line x1="0" y1="1960" x2="1600" y2="1960"/>
    <line x1="0" y1="2240" x2="1600" y2="2240"/>
  </g>

  <!-- Stark Brutalist Spine & Top Index Bar -->
  <rect x="0" y="0" width="20" height="2400" fill="#ef4444"/>
  <rect x="120" y="160" width="1360" height="6" fill="#fafafa"/>
  <text x="120" y="232" text-anchor="start" font-family="JetBrains Mono, Fira Code, monospace" font-size="22" font-weight="700" fill="#ef4444" letter-spacing="4">SYSTEMS & SECURITY ARCHITECTURE // MONOGRAPH</text>
  <text x="1480" y="232" text-anchor="end" font-family="JetBrains Mono, Fira Code, monospace" font-size="22" font-weight="700" fill="#71717a" letter-spacing="3">SPEC // KDP-6X9</text>

  <!-- Bold Left-Aligned Neo-Grotesque Typography -->
  <text x="120" y="480" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, system-ui, sans-serif" font-size="104" font-weight="900" fill="#fafafa" letter-spacing="-1.5">MASTERING MODERN</text>
  <text x="120" y="604" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, system-ui, sans-serif" font-size="104" font-weight="900" fill="#fafafa" letter-spacing="-1.5">DEVOPS (SECOND</text>
  <text x="120" y="728" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, system-ui, sans-serif" font-size="104" font-weight="900" fill="#fafafa" letter-spacing="-1.5">EDITION)</text>
  <rect x="120" y="832" width="340" height="14" fill="#ef4444"/>
  <text x="120" y="900" text-anchor="start" font-family="JetBrains Mono, Fira Code, monospace" font-size="28" font-weight="600" fill="#a1a1aa" letter-spacing="2">A COMPREHENSIVE GUIDE TO INFRASTRUCTURE,</text>
  <text x="120" y="948" text-anchor="start" font-family="JetBrains Mono, Fira Code, monospace" font-size="28" font-weight="600" fill="#a1a1aa" letter-spacing="2">AUTOMATION, PLATFORM ENGINEERING, EBPF,</text>
  <text x="120" y="996" text-anchor="start" font-family="JetBrains Mono, Fira Code, monospace" font-size="28" font-weight="600" fill="#a1a1aa" letter-spacing="2">OPENTELEMETRY, AND CLOUD-NATIVE SECURITY</text>

  <!-- Raw Geometric Brutalist Monolith Composition -->
  <g class="brutalist-monolith" transform="translate(120, 1080)">
    <!-- Outer Structural Frame -->
    <rect x="0" y="0" width="1360" height="820" fill="#18181b" stroke="#fafafa" stroke-width="2"/>
    <!-- Left Monolith Slab -->
    <rect x="0" y="0" width="680" height="820" fill="#09090b" stroke="#3f3f46" stroke-width="1"/>
    <!-- High-Contrast Brutalist Blocks -->
    <rect x="60" y="60" width="560" height="320" fill="#fafafa"/>
    <rect x="60" y="420" width="260" height="340" fill="#ef4444"/>
    <rect x="360" y="420" width="260" height="340" fill="#27272a" stroke="#fafafa" stroke-width="2"/>
    <text x="96" y="160" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="900" fill="#09090b" letter-spacing="-1">ZERO // TRUST</text>
    <line x1="96" y1="196" x2="580" y2="196" stroke="#09090b" stroke-width="4"/>
    <text x="96" y="256" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" fill="#09090b" letter-spacing="2">STRUCTURAL INTEGRITY // VERIFIED</text>
    <text x="96" y="320" font-family="JetBrains Mono, monospace" font-size="20" font-weight="600" fill="#3f3f46" letter-spacing="2">GRID: 1600x2400 // RATIO 2:3</text>

    <!-- Right Architectural Specification Cells -->
    <g fill="#09090b" stroke="#52525b" stroke-width="1">
      <rect x="740" y="60" width="560" height="155"/>
      <rect x="740" y="245" width="560" height="155"/>
      <rect x="740" y="430" width="560" height="155"/>
      <rect x="740" y="615" width="560" height="145"/>
    </g>
    <g fill="#ef4444">
      <rect x="740" y="60" width="12" height="155"/>
      <rect x="740" y="245" width="12" height="155"/>
      <rect x="740" y="430" width="12" height="155"/>
      <rect x="740" y="615" width="12" height="145"/>
    </g>
    <g font-family="JetBrains Mono, Fira Code, monospace" font-size="28" font-weight="700" fill="#fafafa" text-anchor="start" letter-spacing="2">
      <text x="788" y="150">01 // IAM & OIDC</text>
      <text x="788" y="335">02 // OPA & CEL</text>
      <text x="788" y="520">03 // K8S & PSA</text>
      <text x="788" y="700">04 // eBPF & OTEL</text>
    </g>
  </g>

  <!-- Author & Colophon Footer -->
  <text x="120" y="2120" text-anchor="start" font-family="Inter, Helvetica Neue, Arial, system-ui, sans-serif" font-size="48" font-weight="900" fill="#fafafa" letter-spacing="3">Christian Chostak</text>
  <text x="120" y="2185" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="22" font-weight="500" fill="#71717a" letter-spacing="2">SWISS BRUTALIST COLLECTOR&#39;S EDITION • PRODUCTION SYSTEMS SPECIFICATION</text>
</svg>